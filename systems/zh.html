<h1>译本勘误：《系统之美》邱昭良译本</h1>
<p class="lede">对着译本（邱昭良 译，浙江人民出版社 2012，湛庐文化电子版）读的时候用。各页「译本勘误」把译本里会让人读歪的地方挑出来：译错的、意思译反的、漏掉的、关键术语不妥的、数字错的。这里按原书顺序汇总，点页码回到那一页。措辞别扭但意思没错的不收。</p>
<p class="lede">译本和原书的几处不同，不算错，先知道：每章的章名（「系统之奇：系统的6大障碍」）是译本加的，原书只有「Why Systems Surprise Us」这样一句；引言的三个小标题、页边金句前的「系统之思」、方框前的「系统多棱镜」也是译本加的；原书书后的注释、参考书目、编者致谢和作者简介译本没有。</p>
