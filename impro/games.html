<h1>游戏汇总：书里能照着玩的游戏和练习</h1>
<p class="lede">各页「动手：书里的游戏」的游戏卡按原书顺序排在这里。大多数是作者在课上带过的游戏和练习；也有几张是本站照书里的一段课堂经过、一个实验或一句话改出来的，卡上写明了来历。每张卡写了几个人、怎么玩、玩的时候看什么，能一个人试的也写了怎么试。「先猜」那一栏是书里的课堂上发生了什么：先自己猜，或者先玩一次，再点开。点右上角的页码回到那一页，看这个游戏在书里是为了说明什么。</p>
<p class="lede">面具和出神那几篇的练习，作者自己说过有风险。卡片上标了「注意」的，照着做之前先读那一页。</p>
