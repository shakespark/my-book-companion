<h1>译本勘误：《即兴》饶昊鹏译本</h1>
<p class="lede">对着中译本（饶昊鹏译，后浪 / 贵州人民出版社 2020）读的时候用。各页「译本勘误」把译本里会让人读歪的地方挑出来：译错的、意思译反的、漏掉的、关键术语不妥的、数字错的。这里按原书的篇汇总，点页码回到那一页。</p>
<p class="lede">每条的方框里是译本的原句（只摘 20 字以内），在译本电子书里搜它就能找到位置；灰字是英文原文那一处的几个词。不是逐句挑错：措辞不够好、但意思没错的，不收。有几条说的是译者、编者加的脚注里的错（方框里引的就是那条注，比如约翰·布朗、蟾蜍神、唐望），不是正文译错，类型照样标「误译」或「术语」。</p>
