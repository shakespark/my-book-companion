<h1>译本勘误：《當上主管後，難道只能默默崩潰？》許恬寧譯本</h1>
<p class="lede">对着繁体译本（許恬寧譯，時報文化 2020）读的时候用。各章「译本勘误」把译本里会让人读歪的地方挑出来：译错的、意思译反的、漏掉的、关键术语不妥的、数字错的。这里按原书顺序汇总，点章号回到那一章。</p>
<p class="lede">每条的方框里是译本的原句（只摘 20 字以内），在译本电子书里搜它就能找到位置；灰字是英文原文那一处的几个词。不是逐句挑错：这个译本整体流畅，常常意译、加一点原文没有的修饰，措辞不同但意思没错的，不收。</p>
