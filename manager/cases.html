<h1>情境卡：带人时遇到这些事，翻书里哪一节</h1>
<p class="lede">各章「遇到这些事」的情境卡按原书顺序排在这里，给以后带人时查。每张卡从一个具体的处境出发（「第一次和昨天的同事一对一」「要告诉下属他没升上去」），写了先想清楚什么、作者的办法、本站的补充，以及书里讲它的那一节和纸书页码。卡上的办法是提示，不是脚本：照着念会很假，先读书里那一节，再用自己的话说。点右上角的章号回到那一章。</p>
