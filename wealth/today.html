<h1>对照今天：斯密的说法，250 年后怎样了</h1>
<p class="lede">《国富论》1776 年出版。各页「对照今天」把书里能被后来的经济学、历史和数据检验的说法挑出来，分「书里 / 当时 / 今天」三栏，并给一个结论。这里按卷汇总，点页码回到那一页。每张卡写了核对日期。</p>
<ul class="verdicts"><li><span class="v ok">成立</span>今天的经济学和证据支持这句话。</li><li><span class="v mid">部分成立</span>大方向对，细节或适用范围要改。</li><li><span class="v bad">过时</span>说的是 18 世纪的世界，当时也许对，今天的制度和技术已经变了。</li><li><span class="v bad">被推翻</span>后来的经济学或证据说明它错了。</li><li><span class="v dis">有争议</span>经济学界至今没有定论，两边各有代表性的研究。</li></ul>
<p class="lede">结论判的是每张卡标题里「书里的说法：」后面那一句，不是整章。</p>
