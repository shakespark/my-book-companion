<h1>译本勘误：杨敬年译《国富论》</h1>
<p class="lede">对着杨敬年的译本（陕西人民出版社）读的时候用。这个译本整体忠实可靠，这里只收会把人读歪的地方：意思译反的、关键术语按今天的意思译错的（比如 18 世纪的 police 是公共管理，不是警察）。措辞别扭但意思对的不收；电子版的扫描错字（「收入」成了「收人」）也不收。</p>
<p class="lede">每条的灰字是英文原文那一处开头的几个词；方框里是译本的原句（只摘 20 字以内），在译本电子书里搜它。</p>
