# 所有新导读站共用一个仓库：推送到 main 就把改动过的书部署到 https://t.miaowuao.cn/<目录名>/
# 一级目录里，名字不以 _ 或 . 开头、含 index.html 的就是一本书。
# 前提：仓库 Secret DEPLOY_SSH_KEY 已由 ~/tutorials-deploy/scripts/new-deploy-key.sh books <owner/repo> 设置好。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 要拿上一次推送的提交来比对改了哪些书

      - name: rsync 到腾讯云
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo 't.miaowuao.cn ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKl8FY3IexI311v7HuYzX5Ja9bDz1LwzWU0qrm8etp05' > ~/.ssh/known_hosts

          # 手动触发、首次推送、强推（旧提交找不到）或改了 workflow：全部书都推；否则只推改动过的书。
          all=1
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | cut -s -d/ -f1 | sort -u)
            printf '%s\n' "$changed" | grep -qx .github || all=0
          fi

          # 老站各有自己的仓库，占着这些目录；总仓库里同名的书一律不推，免得互相覆盖。
          reserved=" _home api ostep aposd ggs feynman hwgtn odyssey summer letters cmc ftc ddia sysperf "

          # 一本书一本书地推。绝不能把仓库根目录 --delete 到服务器根目录：那会删光 _home 和所有老站。
          fail=0
          for d in */; do
            d=${d%/}
            case $d in _*|.*) continue;; esac
            printf '%s' "$d" | grep -Eqx '[a-z0-9][a-z0-9_-]*' || { echo "跳过 $d：目录名只能用小写字母、数字、- 和 _"; continue; }
            case $reserved in *" $d "*) echo "跳过 $d：和老站重名"; fail=1; continue;; esac
            [ -f "$d/index.html" ] || continue
            [ $all = 1 ] || printf '%s\n' "$changed" | grep -Fqx "$d" || continue
            echo "== 部署 $d"
            ok=0
            # 跨境线路偶尔会抖，失败重试两次。source/（原书材料）绝不能部署。
            for i in 1 2 3; do
              rsync -rlczi --delete --chmod=D755,F644 --timeout=60 \
                --exclude=/source --exclude=/tools/ --exclude=/.claude/ \
                --exclude=/AUTHORING.md --exclude=/NEXT_STEPS.md --exclude=/README.md --exclude=/CLAUDE.md \
                -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20" \
                "./$d/" "deploy@t.miaowuao.cn:$d/" && { ok=1; break; }
              echo "第 $i 次失败，10 秒后重试"; sleep 10
            done
            [ $ok = 1 ] || { echo "$d 部署失败"; fail=1; }
          done
          exit $fail
