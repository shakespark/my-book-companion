<h1>对照今天：书里的说法，后来怎样了</h1>
<p class="lede">这本书 1976 年出版，1989 年加了两章和尾注。各页「对照今天」把书里能被后来的研究检验的说法挑出来，分「书里 / 当时 / 今天」三栏，并给一个结论。这里按原书的章汇总，点页码回到那一页。每张卡写了核对日期：这类内容一两年就会过时。</p>
<ul class="verdicts"><li><span class="v ok">成立</span>后来的研究支持这句话。</li><li><span class="v mid">部分成立</span>大方向对，细节或适用范围要改。</li><li><span class="v bad">被改写</span>后来的研究推翻了它，或者换了一种说法。</li><li><span class="v dis">有争议</span>学界至今没有定论，两边各有代表性的研究。</li></ul>
<p class="lede">结论判的是每张卡标题里「书里的说法：」后面那一句，不是整章。</p>
