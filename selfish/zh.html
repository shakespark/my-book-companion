<h1>译本勘误：《自私的基因》40 周年增订版</h1>
<p class="lede">对着中译本（卢允中等译，中信出版社 2018 年 40 周年增订版）读的时候用。各页「译本勘误」把译本里会让人读糊涂的地方挑出来：译错的、意思译反的、漏掉的、术语前后不一的、数字错的。这里按原书的章汇总，点页码回到那一页。</p>
<p class="lede">每条的灰字是英文原文那一处开头的几个词，在英文电子书里搜它；方框里是译本的原句（只摘 20 字以内），在译本电子书里搜它。不是逐句挑错：措辞不够好、但意思没错的，不收。</p>
