<h1>记忆拼图</h1>
<p class="lede">查理的童年不是按顺序讲的：手术之后，他一段一段想起来，先想起的未必是先发生的。小说页里每段回忆一张卡片，这一页把它们按查理当时的年纪排成一条线；卡片下面写着是在哪一页想起来的。只收你标记读完的页。年纪是从书里推出来的，书里没交代的写「年纪不详」，排在最后。</p>
