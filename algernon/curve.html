<h1>查理的文字曲线</h1>
<p class="lede">查理的进步报告是他自己写的，他的文字就是他的状态。这条曲线从原文里算出来：一条带日期的报告一个点，横轴是报告的编号。按钮切换四个指标，每个指标是什么意思写在图下面。曲线只画到你标记读完的最后一页小说，后面的不提前给你看。</p>
<div class="tip"><p>这些数是脚本粗算的：拼错的词靠一份英文词表来判断，书里的人名、地名不算，丢了撇号的 dont、im 算错。查理学会标点之后有几天故意乱用标点，那几个点会冲到图的顶上，这是真的，不是算错了。</p></div>
<div class="curve" data-all></div>
